namespace: pronunciation-master
createNamespace: true

imagePullPolicy: IfNotPresent

backend:
  replicaCount: 3
  image:
    repository: pronunciation-master-backend
    tag: latest
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

frontend:
  replicaCount: 2
  image:
    repository: pronunciation-master-frontend
    tag: latest
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 80

postgres:
  image: postgres:16-alpine
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

redis:
  image: redis:7-alpine
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

config:
  nodeEnv: production
  dbHost: postgres
  dbPort: "5432"
  dbName: pronunciation_master
  dbUser: dev
  redisHost: redis
  redisPort: "6379"
  redisDb: "0"
  jwtExpiresIn: 24h
  llmProvider: lmstudio
  lmstudioApiUrl: http://host.minikube.internal:1234/v1
  lmstudioModel: google/gemma-4-e4b
  gemma4Model: google/gemma-4-e4b
  rateLimitWindowMs: "3600000"
  rateLimitFree: "100"
  rateLimitPro: "1000"
  rateLimitEnterprise: "10000"
  rateLimitIp: "1000"
  viteApiUrl: http://pronunciation-master.local

secrets:
  dbPassword: devpass
  jwtSecret: pronunciation-master-dev-secret-change-in-production
  stripePublicKey: pk_test_placeholder
  stripeSecretKey: sk_test_placeholder
  stripeWebhookSecret: whsec_placeholder
  awsAccessKeyId: AKIA_DEV_PLACEHOLDER
  awsSecretAccessKey: dev-secret-key-change-in-production

ingress:
  enabled: true
  className: nginx
  host: pronunciation-master.local
  grafanaHost: grafana.pronunciation-master.local
  tls:
    enabled: false
    secretName: pronunciation-master-tls

monitoring:
  prometheus:
    enabled: true
    image: prom/prometheus:v2.48.0
  grafana:
    enabled: true
    image: grafana/grafana:10.2.0
    adminUser: admin
    adminPassword: admin
