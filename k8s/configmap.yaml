apiVersion: v1
kind: ConfigMap
metadata:
  name: pronunciation-config
  namespace: pronunciation-master
  labels:
    app.kubernetes.io/name: pronunciation-master
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "pronunciation_master"
  DB_USER: "dev"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  JWT_EXPIRES_IN: "24h"
  LLM_PROVIDER: "lmstudio"
  LMSTUDIO_API_URL: "http://host.minikube.internal:1234/v1"
  LMSTUDIO_MODEL: "google/gemma-4-e4b"
  GEMMA4_MODEL: "google/gemma-4-e4b"
  RATE_LIMIT_WINDOW_MS: "3600000"
  RATE_LIMIT_FREE: "100"
  RATE_LIMIT_PRO: "1000"
  RATE_LIMIT_ENTERPRISE: "10000"
  RATE_LIMIT_IP: "1000"
  VITE_API_URL: "http://pronunciation-master.local"
