# 개발/minikube용 Secret — 프로덕션에서는 Sealed Secrets 또는 External Secrets 사용
apiVersion: v1
kind: Secret
metadata:
  name: pronunciation-secrets
  namespace: pronunciation-master
  labels:
    app.kubernetes.io/name: pronunciation-master
type: Opaque
stringData:
  DB_PASSWORD: "devpass"
  JWT_SECRET: "pronunciation-master-dev-secret-change-in-production"
  STRIPE_PUBLIC_KEY: "pk_test_placeholder"
  STRIPE_SECRET_KEY: "sk_test_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
  AWS_ACCESS_KEY_ID: "AKIA_DEV_PLACEHOLDER"
  AWS_SECRET_ACCESS_KEY: "dev-secret-key-change-in-production"
