services:
  postgres:
    image: postgres:16-alpine
    container_name: pronunciation-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pronunciation_master
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - pronunciation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d pronunciation_master"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pronunciation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pronunciation-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pronunciation-backend
    ports:
      - "5000:5000"
    environment:
      - LLM_PROVIDER=lmstudio
      - LMSTUDIO_API_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_MODEL=google/gemma-4-e4b
      - GEMMA4_MODEL=google/gemma-4-e4b
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_MAX_DURATION=30000
      - WEBGPU_ENABLED=true
      - ENABLE_AUDIO=true
      - AUDIO_PROVIDER=vllm
      - VLLM_API_URL=http://host.docker.internal:8000/v1
      - VLLM_MODEL=google/gemma-4-e4b
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pronunciation_master
      - DB_USER=dev
      - DB_PASSWORD=devpass
      - JWT_SECRET=pronunciation-master-dev-secret-change-in-production
      - JWT_EXPIRES_IN=24h
      - STRIPE_PUBLIC_KEY=pk_test_placeholder
      - STRIPE_SECRET_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RATE_LIMIT_WINDOW_MS=3600000
      - RATE_LIMIT_FREE=100
      - RATE_LIMIT_PRO=1000
      - RATE_LIMIT_ENTERPRISE=10000
      - RATE_LIMIT_IP=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pronunciation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pronunciation-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WEBGPU_ENABLED=true
    networks:
      - pronunciation-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: pronunciation-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pronunciation-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.2.0
    container_name: pronunciation-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - pronunciation-network
    depends_on:
      - prometheus

  # Optional: vLLM with native input_audio (NVIDIA GPU required)
  # docker compose --profile vllm up -d
  vllm:
    image: vllm/vllm-openai:latest
    container_name: pronunciation-vllm
    profiles:
      - vllm
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model google/gemma-3-4b-it
      --host 0.0.0.0
      --port 8000
      --max-model-len 8192
      --enable-chunked-prefill
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - pronunciation-network

  # Optional: LMStudio Gemma 4 E4B (host LMStudio 권장)
  # docker compose --profile lmstudio up -d
  lmstudio:
    image: ghcr.io/lmstudio-ai/lms:latest
    container_name: pronunciation-lmstudio
    profiles:
      - lmstudio
    environment:
      - MODEL=google/gemma-4-e4b-it
    ports:
      - "1234:1234"
    volumes:
      - lmstudio_models:/models
    networks:
      - pronunciation-network

networks:
  pronunciation-network:
    driver: bridge

volumes:
  lmstudio_models:
  redis_data:
